<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모코파크</title>
<style>
/* ============================================================
   모코파크 — UI (Y2K 네온 픽셀)

   퇴근의 계단과 같은 팀이 하는 연작이라 톤을 그대로 이어받는다. 토큰도
   같은 값이다 — 두 게임을 나란히 띄웠을 때 같은 세계로 보여야 한다.

   규칙 넷:
     1) 바탕은 거의 검은 딥퍼플, 색은 네온 시안·마젠타·옐로 셋
     2) 테두리와 글자에 같은 색 글로우를 한 겹
     3) 패널 위에 아주 옅은 픽셀 격자
     4) 강조는 마젠타, 진행/성공은 시안, 숫자·기록은 옐로
   ============================================================ */
:root{
  --bg-0:#0b0720;
  --bg-1:#150e2e;
  --bg-2:#1d1441;
  --cyan:#3ce8d4;
  --cyan-dim:#1a7d74;
  --pink:#f83fa8;
  --pink-dim:#8d1f5e;
  --yellow:#ffd93d;
  --purple:#a35cff;
  --txt:#eaf6ff;
  --txt-dim:#9b8fd0;
  --txt-hi:#c9bdf5;     /* txt-dim 은 라벨·힌트로 쓰기엔 너무 어둡다. 토큰 넷은
                            그대로 두고, 저대비 문제만 이 밝은 보라 하나로 고친다. */
  --font:"Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:ui-monospace,"Consolas","Courier New",monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg-0);
  font-family:var(--font);color:var(--txt);
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
.hidden{display:none !important;}

.grid{position:relative;}
.grid::before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 1px,transparent 1px 3px);
}
.neon{
  background:linear-gradient(180deg,var(--bg-2),var(--bg-1));
  border:2px solid var(--cyan);border-radius:12px;
  box-shadow:0 0 0 1px rgba(60,232,212,.25), 0 0 16px rgba(60,232,212,.30),
             inset 0 0 22px rgba(60,232,212,.10);
}
.btnx{transition:transform .07s ease, box-shadow .12s ease, filter .12s ease;}
.btnx:active{transform:translateY(2px) scale(.985);}
button{font-family:var(--font);color:var(--txt);cursor:pointer;}
button:disabled{opacity:.45;cursor:default;}

/* ---------- 화면 공통 ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:20px;overflow:auto;z-index:5;}
.panel{width:min(680px,96vw);padding:24px 26px 28px;}
h1{margin:0 0 4px;font-size:38px;letter-spacing:6px;text-align:center;
  color:#fff;text-shadow:0 0 8px var(--pink),0 0 22px var(--pink),0 0 46px rgba(248,63,168,.7);}
.sub{margin:0 0 20px;text-align:center;font-family:var(--mono);font-size:13px;
  letter-spacing:2px;color:var(--txt-hi);}
label{display:block;font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:2px;
  color:var(--cyan);margin:0 0 6px;text-shadow:0 0 8px rgba(60,232,212,.7);}
input{width:100%;padding:12px 14px;font-family:var(--font);font-size:18px;
  color:var(--txt);background:rgba(11,7,32,.75);border:2px solid var(--cyan-dim);
  border-radius:10px;outline:none;}
input:focus{border-color:var(--cyan);box-shadow:0 0 14px rgba(60,232,212,.35);}
.row{display:flex;gap:10px;align-items:flex-end;margin-top:16px;}
.row > *{flex:1;}
.cta{min-height:52px;font-size:17px;font-weight:800;letter-spacing:2px;color:#fff;
  border:none;border-radius:12px;
  background:linear-gradient(120deg,var(--pink),var(--purple) 55%,var(--cyan));
  box-shadow:0 0 18px rgba(248,63,168,.45);}
.ghost{min-height:52px;font-size:16px;font-weight:700;letter-spacing:2px;
  color:var(--cyan);background:transparent;border:2px dashed var(--cyan);
  border-radius:12px;text-shadow:0 0 8px rgba(60,232,212,.8);}

/* ---------- 캐릭터 고르기 ----------
   시작 화면(#charPick)과 대기실(#charPickLobby) 둘 다 이 .char 카드를 쓴다.
   얼굴을 알아볼 크기(84px 폭)로 키우고 이름도 13px 이상으로 올렸다 —
   "이 카드가 이 게임의 얼굴이다"인데 9px 이름표로는 아무도 못 읽었다. */
#charPick,#charPickLobby{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px;}
.char{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 3px 7px;
  background:rgba(11,7,32,.6);border:2px solid rgba(163,92,255,.35);border-radius:10px;}
.char.on{border-color:var(--pink);box-shadow:0 0 14px rgba(248,63,168,.5);
  background:rgba(248,63,168,.10);}
.char canvas{display:block;}
.cname{font-family:var(--mono);font-size:13px;letter-spacing:0;color:var(--txt-hi);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.char.on .cname{color:var(--pink);}
/* 잠긴 칸 — 다른 사람이 이미 고른 캐릭터. 지워버리듯 흐리고 줄을 긋는다.
   "고장났다"가 아니라 "이미 임자가 있다"로 읽혀야 한다. */
.char.locked{opacity:.45;background:rgba(11,7,32,.35);cursor:default;}
.char.locked .cname{text-decoration:line-through;color:var(--txt-dim);}
.claim{display:none;font-family:var(--mono);font-size:13px;color:var(--yellow);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.char.locked .claim{display:block;}

/* ---------- 대기실 ----------
   우선순위를 뒤집는다: 누가 와 있는지(로스터)가 제일 크고, 링크 복사는
   보조 버튼으로 내려간다. 방 코드 옆에 인원수(N / 8)를 붙여 언제 시작해도
   되는지 한눈에 보이게 한다. */
.lobbyHead{display:flex;align-items:flex-end;justify-content:center;gap:18px;
  flex-wrap:wrap;margin-bottom:2px;}
#roomCode{font-family:var(--mono);font-size:56px;font-weight:800;letter-spacing:12px;
  text-align:center;color:var(--yellow);margin:2px 0 2px;
  text-shadow:0 0 10px var(--yellow),0 0 30px rgba(255,217,61,.6);}
#playerCount{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--cyan);
  text-shadow:0 0 8px rgba(60,232,212,.7);padding-bottom:10px;
  font-variant-numeric:tabular-nums;}

/* 로스터 — 얼굴·이름·캐릭터가 다 보여야 "누가 뭘로 하는지"가 읽힌다 */
#whoList{list-style:none;margin:14px 0 0;padding:0;display:grid;
  grid-template-columns:repeat(2,1fr);gap:10px;}
.wrow{display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:rgba(11,7,32,.6);border:2px solid rgba(60,232,212,.25);border-radius:12px;}
.wrow.me{border-color:var(--cyan);box-shadow:0 0 12px rgba(60,232,212,.3);}
.wface{border-radius:6px;flex:none;}
.wtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.wname{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;}
.wchar{font-family:var(--mono);font-size:13px;color:var(--txt-hi);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.crown{font-size:17px;flex:none;}
/* AI 표시 — 이름 옆에 붙여서 로스터를 훑으면 사람이 몇인지 바로 세어진다 */
.aitag{margin-left:6px;padding:1px 5px;border-radius:5px;font-family:var(--mono);
  font-size:11px;font-weight:800;letter-spacing:.5px;vertical-align:1px;
  color:#0b0720;background:var(--yellow);}

/* AI 넣고 빼기 — 시작 버튼 바로 위에 둔다. 혼자 들어온 사람이 제일 먼저
   찾게 되는 것이고, 못 찾으면 혼자 대기실에서 시작만 누르다 나간다. */
.botRow{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 12px;
  border-radius:10px;background:rgba(11,7,32,.5);
  border:2px solid rgba(255,217,61,.25);}
.botRow .lbl{flex:1;min-width:0;font-family:var(--mono);font-size:13px;
  color:var(--txt-hi);letter-spacing:.5px;}
.botRow .lbl b{color:var(--yellow);}
#botCount{font-family:var(--mono);font-size:13px;font-weight:800;color:var(--yellow);
  flex:none;margin-right:4px;}
.botRow button{min-height:38px;font-size:13px;flex:none;padding:0 14px;}
.botRow button:disabled{opacity:.35;cursor:not-allowed;}

/* 캐릭터 바꾸기(대기실) — 시작 화면 카드와 같은 모양을 쓰되 잠금 상태만 는다 */
#charPickLobby{margin-bottom:4px;}

/* 공정 파이프라인 — 글로 안 읽던 걸 게임에서 쓰는 색 그대로 보여준다.
   레퍼런스→모델링→리토폴→납품, 물건이 실제로 거쳐가는 색(sprite.js ITEMS)과
   맞춘다. 납품만 노랑인 이유는 상단바 납품 숫자(#goal b)도 노랑이라서다. */
.pipeline{display:flex;align-items:center;justify-content:center;gap:6px;
  flex-wrap:wrap;margin-top:14px;padding:10px 8px;border-radius:10px;
  background:rgba(11,7,32,.5);}
.pstep{display:flex;align-items:center;gap:6px;font-family:var(--mono);
  font-size:13px;font-weight:700;color:var(--pc);letter-spacing:.5px;}
.pdot{width:12px;height:12px;border-radius:3px;background:var(--pc);
  box-shadow:0 0 8px var(--pc);flex:none;}
.parrow{color:var(--txt-dim);font-size:14px;}

.controlsHint{margin:12px 0 0;text-align:center;font-family:var(--mono);
  font-size:14px;letter-spacing:.5px;color:var(--txt-hi);}
.controlsHint b{color:var(--yellow);text-shadow:0 0 8px rgba(255,217,61,.6);}

.ghost.small{min-height:40px;font-size:13px;flex:none;padding:0 16px;}


/* 다시 시작 띠 */
#retryBanner{position:fixed;left:50%;top:26%;transform:translateX(-50%);
  z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:14px 30px;border-radius:14px;pointer-events:none;
  background:rgba(11,7,32,.86);border:3px solid var(--pink);
  box-shadow:0 0 30px rgba(248,63,168,.55);}
#retryBanner b{font-family:var(--mono);font-size:34px;letter-spacing:4px;
  color:var(--pink);text-shadow:0 0 14px rgba(248,63,168,.8);}
#retryWho{font-family:var(--mono);font-size:14px;color:var(--txt-hi);}
#retryWho:empty{display:none;}

/* 막혔을 때 버튼 — 화면 아래 구석. 게임을 가리면 안 된다. */
#stuckBar{position:fixed;right:12px;bottom:12px;z-index:50;display:flex;gap:8px;}
#stuckBar button{min-height:34px;font-size:12px;padding:0 12px;opacity:.55;}
#stuckBar button:hover:not(:disabled){opacity:1;}
#stuckBar button:disabled{opacity:.2;cursor:not-allowed;}

/* ---------- 게임 ---------- */
#screenGame{display:block;padding:0;background:#000;}
/* 레터박스: 캔버스를 창 한가운데 겹쳐 놓는다. 두 장이 정확히 같은 자리에
   있어야 바닥과 캐릭터가 어긋나지 않으므로 둘 다 같은 방식으로 가운데 잡는다. */
#stage{position:absolute;inset:0;}
#floor,#actors{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:block;image-rendering:pixelated;}
#floor{z-index:1;}
#actors{z-index:2;}
#topbar{position:fixed;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;
  gap:14px;padding:8px 14px;background:linear-gradient(180deg,rgba(11,7,32,.92),rgba(11,7,32,0));
  pointer-events:none;}
#goal{font-family:var(--mono);font-size:13px;letter-spacing:2px;color:var(--cyan);
  text-shadow:0 0 8px rgba(60,232,212,.8);}
#goal b{font-size:22px;color:var(--yellow);text-shadow:0 0 10px rgba(255,217,61,.8);
  font-variant-numeric:tabular-nums;}
#stat{margin-left:auto;font-family:var(--mono);font-size:13px;letter-spacing:1px;
  color:var(--txt-hi);}
#hint{position:fixed;left:0;right:0;bottom:6px;z-index:6;text-align:center;
  font-family:var(--mono);font-size:14px;letter-spacing:1px;color:var(--txt-hi);
  pointer-events:none;text-shadow:0 0 6px rgba(11,7,32,.9);}
#netWarn{position:fixed;left:0;right:0;top:0;z-index:9;padding:9px 12px;text-align:center;
  font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:1px;color:#fff;
  background:var(--pink-dim);border-bottom:2px solid var(--pink);
  box-shadow:0 0 20px rgba(248,63,168,.6);}

/* 판 클리어 — 전원 도착(state.cleared)을 잠깐 화면 가운데 크게 보여준다.
   판정은 여기서 안 한다(hud.js 는 켜고 끄기만 한다) — 그림만 담당. */
#clearBanner{position:fixed;inset:0;z-index:8;display:flex;align-items:center;
  justify-content:center;pointer-events:none;}
#clearBanner span{font-family:var(--mono);font-size:52px;font-weight:800;letter-spacing:6px;
  color:var(--cyan);background:rgba(11,7,32,.55);padding:14px 34px;border-radius:16px;
  border:2px solid var(--cyan);text-shadow:0 0 14px var(--cyan),0 0 40px rgba(60,232,212,.8);}
</style>
</head>
<body>

<!-- 게임 화면. 캔버스 두 장 — #floor 는 바뀔 때만, #actors 만 매 프레임. -->
<div id="screenGame" class="screen hidden">
  <div id="stage">
    <canvas id="floor"></canvas>
    <canvas id="actors"></canvas>
  </div>
  <div id="topbar">
    <div id="goal">판 <b><span id="lvNow">1</span> / <span id="lvTotal">3</span></b> <span id="lvName"></span></div>
    <div id="stat"></div>
  </div>
  <div id="clearBanner" class="hidden"><span>클리어!</span></div>
  <div id="hint">←→ · A D 이동 &nbsp;·&nbsp; Space / ↑ / W 점프</div>
</div>

<!-- 시작 -->
<div id="screenStart" class="screen">
  <div class="panel neon grid">
    <h1>모코파크</h1>
    <p class="sub">MOCO PARK — 다 같이 나가야 퇴근이다</p>

    <label for="nick">닉네임</label>
    <input id="nick" maxlength="12" placeholder="이름 (최대 12자)" autocomplete="off">

    <label style="margin-top:16px">캐릭터</label>
    <div id="charPick"></div>

    <div class="row">
      <button id="btnCreate" class="cta btnx">방 만들기</button>
    </div>
    <div class="row">
      <div style="flex:1.2">
        <label for="roomInput">방 코드</label>
        <input id="roomInput" maxlength="4" placeholder="----" autocomplete="off"
               style="font-family:var(--mono);letter-spacing:8px;text-align:center;">
      </div>
      <button id="btnJoin" class="ghost btnx">입장</button>
    </div>
  </div>
</div>

<!-- 대기실. 누가 와 있는지(로스터)가 가장 크고, 초대 링크 복사는 보조
     버튼으로 내렸다 — 시작 전에 사람들이 실제로 보는 것은 "누가 왔고 뭘로
     하는지"이지 복사 버튼이 아니다. -->
<div id="screenLobby" class="screen hidden">
  <div class="panel neon grid">
    <div class="lobbyHead">
      <div>
        <p class="sub" style="margin-bottom:0">방 코드</p>
        <div id="roomCode">----</div>
      </div>
      <div id="playerCount">0 / 8</div>
    </div>

    <ul id="whoList"></ul>

    <label style="margin-top:16px">캐릭터 바꾸기</label>
    <div id="charPickLobby"></div>

    <div class="pipeline" id="pipeline">
      <div class="pstep" style="--pc:var(--pink)"><span class="pdot"></span>첫 출근</div>
      <span class="parrow">→</span>
      <div class="pstep" style="--pc:var(--cyan)"><span class="pdot"></span>목마</div>
      <span class="parrow">→</span>
      <div class="pstep" style="--pc:var(--yellow)"><span class="pdot"></span>누가 남을래</div>
    </div>
    <p class="controlsHint">←→ / A D 로 이동 &nbsp;·&nbsp; <b>Space</b> / ↑ / W 로 점프</p>

    <!-- 사람이 모자라도 놀 수 있게. 2번 판(목마)은 최소 두 명이라
         혼자 들어왔으면 여기서 AI 를 하나는 넣어야 한다. -->
    <div class="botRow">
      <span class="lbl">사람이 모자라면 <b>AI 동료</b>를 넣으세요</span>
      <span id="botCount">AI 없음</span>
      <button id="btnRemoveBot" class="ghost btnx" type="button">−</button>
      <button id="btnAddBot" class="ghost btnx" type="button">+ AI</button>
    </div>

    <div class="row">
      <button id="btnStart" class="cta btnx">시작</button>
      <button id="btnCopyLink" class="ghost btnx small">초대 링크 복사</button>
    </div>
  </div>
</div>

<!-- 완주 화면. 3판을 다 깨면 phase 가 'result' 가 되어 모두 여기로 온다.
     ('done' 이 아니라 'result' 인 이유는 js/game.js 의 advanceLevel() 주석 참고 —
     meta/phase 규칙이 옛 값만 받아 준다.)
     로비로 돌아가는 건 호스트만 — 다들 누르면 두 판이 동시에 새로 만들어진다. -->
<div id="screenDone" class="screen hidden">
  <div class="panel neon grid">
    <h1>다 퇴근했다</h1>
    <p class="sub">ALL CLEAR — 오늘은 다 같이 나갑니다</p>
    <div class="row">
      <button id="btnLobby" class="cta btnx">로비로</button>
    </div>
  </div>
</div>

<!-- 라운드가 다시 시작됐다는 띠. 왜 튕겼는지 안 보여 주면
     다들 자기 조작을 의심한다. -->
<div id="retryBanner" class="hidden">
  <b>다시!</b><span id="retryWho"></span>
</div>

<!-- 막혔을 때 빠져나갈 길. 다시 하기는 아무나(못 나가는 자리에 끼면
     호스트를 기다려야 하는 게 더 나쁘다), 건너뛰기는 호스트만. -->
<div id="stuckBar">
  <button id="btnRetry" class="ghost btnx" type="button" title="R">다시 하기</button>
  <button id="btnSkip" class="ghost btnx" type="button">이 판 건너뛰기</button>
</div>

<div id="netWarn" class="hidden"></div>

<!-- 순서를 바꾸면 sim.js 가 Levels 를 못 찾는 식으로 조용히 깨진다.
     game.js 는 반드시 마지막이다. -->
<script src="js/cloud-config.js"></script>
<script src="js/net.js"></script>
<script src="js/room.js"></script>
<script src="js/tiles.js"></script>
<script src="js/grid.js"></script>
